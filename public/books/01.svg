<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="85%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="850" fill="url(#bgGrad1)"/>
  
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="30" height="850" fill="#000000" opacity="0.4"/>
  <rect x="30" y="0" width="3" height="850" fill="#ffffff" opacity="0.15"/>

  <!-- Molecular DNA & Chemical Watermark -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5" fill="none">
    <path d="M 80,180 Q 120,240 160,180 T 240,180 T 320,180 T 400,180 T 480,180"/>
    <path d="M 80,240 Q 120,180 160,240 T 240,240 T 320,240 T 400,240 T 480,240"/>
    <line x1="120" y1="210" x2="120" y2="210" stroke-width="6"/>
    <line x1="200" y1="210" x2="200" y2="210" stroke-width="6"/>
    <line x1="280" y1="210" x2="280" y2="210" stroke-width="6"/>
    <line x1="360" y1="210" x2="360" y2="210" stroke-width="6"/>
    <!-- Benzene rings -->
    <polygon points="460,120 485,105 510,120 510,150 485,165 460,150"/>
    <polygon points="510,120 535,105 560,120 560,150 535,165 510,150"/>
  </g>

  <!-- Top Syllabus Banner -->
  <rect x="30" y="24" width="540" height="48" rx="6" fill="#022c22" opacity="0.9"/>
  <rect x="30" y="24" width="540" height="48" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1.2" opacity="0.6"/>
  <text x="50" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#5eead4" letter-spacing="0.8">STRICTLY AS PER PCI EDUCATION REGULATION 2020 (ER 2020)</text>
  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#ccfbf1">D. Pharmacy Second Year • Pharmacy Council of India</text>

  <!-- Publisher Logo Box -->
  <rect x="470" y="30" width="86" height="34" rx="4" fill="#0d9488"/>
  <text x="513" y="45" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">PEE VEE</text>
  <text x="513" y="57" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#fef08a" text-anchor="middle">PV BOOKS</text>

  <!-- Main Book Title -->
  <g transform="translate(50, 105)">
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#a7f3d0">Essentials of</text>
    <text x="0" y="80" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="url(#shadow1)" letter-spacing="-0.5">
      BIOCHEMISTRY
    </text>
    <text x="0" y="128" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#goldText)" filter="url(#shadow1)">
      &amp; Clinical Pathology
    </text>
    <rect x="0" y="148" width="360" height="3" fill="#2dd4bf"/>
    <text x="0" y="176" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#99f6e4">
      Comprehensive Academic Textbook for Pharmacy Students
    </text>
  </g>

  <!-- Central Scientific Illustration -->
  <g transform="translate(55, 330)">
    <rect x="0" y="0" width="490" height="240" rx="14" fill="#042f2e" opacity="0.8" stroke="#14b8a6" stroke-width="1.2"/>
    
    <!-- Microscope & Clinical Lab Visual Graphic -->
    <g transform="translate(40, 25)">
      <!-- Microscope Body -->
      <path d="M 50,150 L 100,150 L 95,140 L 75,140 L 75,90 C 95,85 105,65 95,45 L 85,25 L 65,35 L 75,55 C 65,65 65,80 75,90 Z" fill="#2dd4bf" opacity="0.85"/>
      <rect x="40" y="150" width="70" height="12" rx="3" fill="#0f766e"/>
      <circle cx="85" cy="40" r="12" fill="#fef08a" opacity="0.8"/>
      
      <!-- Laboratory Flask & Test Tubes -->
      <g transform="translate(140, 40)">
        <!-- Flask -->
        <path d="M 40,0 L 50,0 L 50,30 L 75,80 C 80,90 70,100 60,100 L 30,100 C 20,100 10,90 15,80 L 40,30 Z" fill="#14b8a6" opacity="0.6"/>
        <ellipse cx="45" cy="85" rx="20" ry="8" fill="#5eead4"/>
        
        <!-- Diagnostic Test Tubes Rack -->
        <rect x="100" y="20" width="16" height="70" rx="8" fill="#f43f5e" opacity="0.7"/>
        <rect x="124" y="10" width="16" height="80" rx="8" fill="#3b82f6" opacity="0.7"/>
        <rect x="148" y="30" width="16" height="60" rx="8" fill="#eab308" opacity="0.7"/>
      </g>

      <!-- Key Clinical Concepts Badges -->
      <g transform="translate(230, 20)" font-family="system-ui, sans-serif" font-size="11">
        <rect x="0" y="0" width="190" height="28" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="0.8"/>
        <text x="12" y="18" fill="#5eead4" font-weight="700">✓ Biomolecules &amp; Metabolism</text>
        
        <rect x="0" y="38" width="190" height="28" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="0.8"/>
        <text x="12" y="56" fill="#5eead4" font-weight="700">✓ Enzymes &amp; Metabolic Pathways</text>
        
        <rect x="0" y="76" width="190" height="28" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="0.8"/>
        <text x="12" y="94" fill="#5eead4" font-weight="700">✓ Clinical Diagnostic Pathology</text>

        <rect x="0" y="114" width="190" height="28" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="0.8"/>
        <text x="12" y="132" fill="#5eead4" font-weight="700">✓ Organ Function Blood Tests</text>
      </g>
    </g>
  </g>

  <!-- Authors Block -->
  <g transform="translate(50, 600)">
    <rect x="0" y="0" width="500" height="110" rx="10" fill="#022c22" opacity="0.6" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="20" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#5eead4" letter-spacing="1">AUTHORS &amp; EDITORS</text>
    
    <g transform="translate(20, 36)" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">
      <text x="0" y="16">Pallavi L. Phalke</text>
      <text x="170" y="16" font-weight="800" fill="#facc15">Tushar G. Rukari</text>
      <text x="340" y="16">Dr. Dipti H. Patel</text>
      
      <text x="0" y="44">Avinash B. Thalkari</text>
      <text x="170" y="44">Dr. Vijay A. Jagtap</text>
    </g>
  </g>

  <!-- Footer Section -->
  <g transform="translate(50, 740)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#2dd4bf" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">
      PEE VEE BOOKS
    </text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#99f6e4">
      S. Vikas and Company (Medical Publishers) India
    </text>

    <rect x="360" y="8" width="140" height="38" rx="6" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="370" y="24" font-family="monospace" font-size="9" fill="#99f6e4">ISBN 978-1-5433-4657-2</text>
    <text x="370" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#34d399">● ER-2020 SYLLABUS</text>
  </g>
</svg>
