<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#312e81"/>
      <stop offset="85%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="850" fill="url(#bgGrad3)"/>
  
  <!-- Spine Shadow -->
  <rect x="0" y="0" width="30" height="850" fill="#000000" opacity="0.4"/>
  <rect x="30" y="0" width="3" height="850" fill="#ffffff" opacity="0.15"/>

  <!-- Top LAP LAMBERT Classic Brand Banner -->
  <rect x="0" y="0" width="600" height="90" fill="#ffffff"/>
  <text x="50" y="44" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#dc2626" letter-spacing="1">LAP</text>
  <text x="96" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#18181b">LAMBERT</text>
  <text x="50" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#52525b" letter-spacing="0.5">Academic Publishing</text>

  <!-- Author Name at Top -->
  <g transform="translate(50, 130)">
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
      Tushar Rukari
    </text>
    <line x1="0" y1="36" x2="500" y2="36" stroke="#6366f1" stroke-width="1.5"/>
  </g>

  <!-- Main Research Monograph Title -->
  <g transform="translate(50, 195)">
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" filter="url(#shadow3)" letter-spacing="-0.5">
      Esomeprazole Magnesium
    </text>
    <text x="0" y="82" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="#a5b4fc" filter="url(#shadow3)">
      Delayed-Release Tablets
    </text>
    <text x="0" y="125" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e0e7ff">
      Formulation and Evaluation of Enteric-Coated Systems
    </text>
  </g>

  <!-- Central Scientific / Monograph Graphic Illustration -->
  <g transform="translate(55, 360)">
    <rect x="0" y="0" width="490" height="250" rx="14" fill="#0f172a" opacity="0.8" stroke="#6366f1" stroke-width="1.2"/>
    
    <!-- Enteric Tablet Core & Coating Layer Illustration -->
    <g transform="translate(45, 30)">
      <!-- Multi-layered Tablet Cross-section -->
      <ellipse cx="90" cy="90" rx="75" ry="50" fill="#312e81" stroke="#818cf8" stroke-width="3"/>
      <!-- Subcoat layer -->
      <ellipse cx="90" cy="90" rx="60" ry="38" fill="#4338ca" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="3"/>
      <!-- Tablet Core -->
      <ellipse cx="90" cy="90" rx="45" ry="26" fill="#f8fafc"/>
      <text x="90" y="93" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1e1b4b" text-anchor="middle">ACTIVE DRUG</text>
      <text x="90" y="103" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">CORE (Esomeprazole)</text>

      <!-- Coating Callout Lines -->
      <line x1="165" y1="90" x2="200" y2="60" stroke="#a5b4fc" stroke-width="1"/>
      <text x="205" y="58" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc">Enteric Functional Polymer (pH &gt; 5.5)</text>

      <!-- Key Research Findings Box -->
      <g transform="translate(200, 80)" font-family="system-ui, sans-serif" font-size="10">
        <rect x="0" y="0" width="220" height="90" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.8"/>
        <text x="12" y="20" fill="#c7d2fe" font-weight="700">• Acid Resistance in 0.1N HCl (&lt; 5%)</text>
        <text x="12" y="38" fill="#c7d2fe" font-weight="700">• Rapid Dissolution in pH 6.8 Buffer</text>
        <text x="12" y="56" fill="#c7d2fe" font-weight="700">• Enhanced Gastro-Stability</text>
        <text x="12" y="74" fill="#86efac" font-weight="700">✓ In-Vitro Dissolution Kinetics Verified</text>
      </g>
    </g>
  </g>

  <!-- Monograph Abstract Summary -->
  <g transform="translate(50, 640)">
    <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1">RESEARCH MONOGRAPH</text>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">
      An exhaustive monograph describing pharmaceutical formulation optimization,
    </text>
    <text x="0" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#cbd5e1">
      enteric polymer coating strategies, stability testing, and in-vitro release kinetics.
    </text>
  </g>

  <!-- Footer Section with ISBN -->
  <g transform="translate(50, 740)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#6366f1" stroke-width="1.2" opacity="0.6"/>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">
      LAP LAMBERT Academic Publishing
    </text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#a5b4fc">
      Saarbrücken, Germany • International Academic Monographs
    </text>

    <rect x="360" y="8" width="140" height="38" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="370" y="24" font-family="monospace" font-size="9" fill="#cbd5e1">ISBN 978-3-659-35689-6</text>
    <text x="370" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#818cf8">● MONOGRAPH</text>
  </g>
</svg>
